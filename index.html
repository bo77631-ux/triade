<title>Tríade</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tríade">
<meta name="theme-color" content="#111110">
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna para celular, navegação fixa embaixo, cartões sobre fundo escuro; cor só nos dados. */
:root{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --raised:#252523; --line:#343330;
  --ink:#f0efec; --ink2:#c3c2b7; --mute:#8d8c82;
  --accent:#f0efec; --on-accent:#111110;
  --kcal:#3987e5; --prot:#d95926; --carb:#199e70; --fat:#c98500;
  --violet:#9085e9; --magenta:#d55181;
  --good:#0ca30c; --warn:#c98500; --bad:#e66767;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-weight:800;font-size:30px;line-height:1.05}
h2{font-weight:700;font-size:19px}
h3{font-weight:700;font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)} .sec{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:11.5px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.top p{margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.card.tap{cursor:pointer}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.big small{font:400 13px var(--body);color:var(--mute);margin-left:3px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 -2px}
.link{background:none;border:0;padding:4px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:10px 16px;font-weight:500;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;flex:none;font-size:18px}
:focus-visible{outline:2px solid var(--kcal);outline-offset:2px}
.seg{display:flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 12px;white-space:nowrap;color:var(--ink2);font-size:14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--ink2)}
.chip.fill{background:var(--raised);border-color:var(--raised);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--raised)}
.pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.good{color:var(--good)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.done .grow{opacity:.5;text-decoration:line-through}
.chk{appearance:none;width:24px;height:24px;border:2px solid var(--mute);border-radius:7px;flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-1px)}
.bar{height:7px;border-radius:4px;background:var(--raised);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px}
.macro{display:grid;grid-template-columns:1fr;gap:4px}
.macro .lbl{display:flex;justify-content:space-between;font-size:12.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{min-width:0;border:1.5px solid var(--line);background:none;border-radius:22px;padding:8px 0;text-align:center;line-height:1.15}
.day b{display:block;font-size:16px;font-weight:600} .day span{font-size:11px;color:var(--mute)}
.day[aria-pressed="true"]{background:var(--raised);border-color:var(--ink2)}
.day.today b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin:2px auto 0}
.habit{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.habit i{aspect-ratio:1;border-radius:3px;background:var(--raised)}
.empty{color:var(--mute);font-size:13.5px;padding:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
table.t th{color:var(--mute);font-weight:500;border-top:0}
table.t td.r,table.t th.r{text-align:right}
/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(26,26,25,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
nav a{color:var(--mute);text-decoration:none;font-size:11.5px;text-align:center;padding:6px 0;display:grid;gap:3px;justify-items:center}
nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--ink);font-weight:600}
#plus{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;line-height:1;justify-self:center;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
/* folha (modal) */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
#scrim.on{display:flex}
#sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
#sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
#sheet .sh-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-8px;background:var(--surface);padding:8px 0;z-index:2}
#sheet .sh-head h2{flex:1;text-align:center;margin-right:42px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink2)}
.field .help{font-size:12px;color:var(--mute)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;font-size:16px}
textarea{min-height:110px;font-size:13px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:18px;font-size:13.5px;font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
/* gráficos */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--body);fill:var(--mute);font-variant-numeric:tabular-nums}
.tip{position:absolute;top:0;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;pointer-events:none;white-space:nowrap;display:none;z-index:3}
.tip b{display:block;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.sq{height:10px;width:10px;border-radius:3px}
.rings{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:8px;text-align:center}
.rings svg{width:100%;height:auto}
.rings .rl{font-family:var(--display);font-weight:700;margin-top:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr) 76px;gap:6px 4px;align-items:end}
.wk .col{height:44px;background:var(--raised);border-radius:4px;position:relative;overflow:hidden}
.wk .col span{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0}
.wk .col.over{outline:1.5px solid var(--bad)}
.wk .v{font-size:12px;line-height:1.2;padding-left:6px}
.wk .v b{font-size:15px;display:block}
.wk .d{font-size:11px;color:var(--mute);text-align:center}
.wk .d.on{color:var(--ink);font-weight:700}
/* treino */
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px 34px;gap:8px;align-items:center;margin-top:8px}
.setrow input[type=number]{padding:8px 6px;text-align:center;min-height:40px}
.setn{width:26px;height:26px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.rir{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#111;background:var(--warn)}
.rir.z{background:var(--bad)}
.exh{display:flex;gap:10px;align-items:flex-start}
.exbadge{width:44px;height:44px;border-radius:10px;background:var(--raised);display:grid;place-items:center;font:700 13px var(--display);color:var(--ink2);flex:none}
.body{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:330px;margin:0 auto}
.body svg{width:100%;height:auto}
.body .m{fill:#3a3a37;stroke:var(--surface);stroke-width:1.5}
.body .base{fill:#2b2b29}
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;background:var(--raised);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hr{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}
.hr .h{font-size:12.5px;color:var(--mute);padding-top:3px}
.food{display:flex;justify-content:space-between;gap:10px;padding:5px 0;cursor:pointer}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--raised);color:var(--ink2);white-space:nowrap}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:none;border-radius:14px;padding:11px 14px;line-height:1.3}
.opt small{display:block;color:var(--mute);font-size:12.5px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--raised)}
.tag.prova{background:var(--ink);color:var(--bg)}
.tag.ic{color:var(--violet)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function toDocs(){
  const d={settings:S.settings,diet:S.diet,body:S.body,train:S.train,study:S.study};
  for(const day in S.dlog){if(!S.dlog[day].length)continue;const k="dlog-"+day.slice(0,7);(d[k]??={days:{}}).days[day]=S.dlog[day]}
  for(const s of S.wlog){const k="wlog-"+s.d.slice(0,4);(d[k]??={sessions:[]}).sessions.push(s)}

function fromDocs(docs){
  docs=JSON.parse(JSON.stringify(docs));const b=blank();
  for(const k of ["settings","diet","body","train","study"])if(docs[k])b[k]={...b[k],...docs[k]};
  b.dlog={};b.wlog=[];
  for(const k in docs){if(k.startsWith("dlog-"))Object.assign(b.dlog,docs[k].days||{});if(k.startsWith("wlog-"))b.wlog.push(...(docs[k].sessions||[]))}
  S=b;
}
function readLocal(){const docs={};let any=false;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS)){docs[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k));any=true}}}catch(e){}return any?docs:null}
function writeLocal(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
function save(){if(saveTimer)return;saveTimer=setTimeout(()=>{saveTimer=null;flush()},150)}
function flushNow(){clearTimeout(saveTimer);saveTimer=null;flush()}
window.addEventListener("pagehide",flushNow);document.addEventListener("visibilitychange",()=>{if(document.hidden)flushNow()});
async function flush(){
  if(flushing){save();return}
  flushing=true;
  try{
    const d=toDocs();
    for(const k in d){
      const j=JSON.stringify(d[k]);if(lastSaved[k]===j)continue;
      writeLocal(k,d[k]);
      if(false){
        try{await Store.base.doc(k).set(d[k]);lastSaved[k]=j}
        catch(e){
          if(e&&e.code==="quota_exceeded"){toast("Espaço da conta cheio. Faça um backup em Mais e apague registros antigos.");lastSaved[k]=j;continue}
          Store.mode="local";toast("Sem sincronização agora. Os dados ficam salvos neste aparelho.");lastSaved[k]=j;
        }
      }else lastSaved[k]=j;
    }
  }finally{flushing=false}
}

const seg=(name,opts,cur)=>`<div class="seg" role="group">${opts.map(o=>`<button data-act="seg" data-name="${name}" data-v="${o[0]}" aria-pressed="${o[0]===cur}">${o[1]}</button>`).join("")}</div>`;
const backHead=(title,right="")=>`<div class="row between" style="margin-bottom:14px"><button class="icon-btn" data-act="back" aria-label="Voltar">‹</button><h2 class="grow" style="text-align:center">${esc(title)}</h2>${right||'<span style="width:42px"></span>'}</div>`;
/* formulário genérico: fields [{k,label,type,def,options,help,step,ph}] */
let formCb=null;
function openForm(title,fields,cb,opts={}){
  formCb=cb;
  const f=x=>{const id="f_"+x.k,v=x.def??"";
    if(x.type==="select")return `<select id="${id}">${x.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
    if(x.type==="textarea")return `<textarea id="${id}" placeholder="${esc(x.ph||"")}">${esc(v)}</textarea>`;
    return `<input id="${id}" type="${x.type==="number"?"text":x.type||"text"}" ${x.type==="number"?'inputmode="decimal"':""} value="${esc(v)}" placeholder="${esc(x.ph||"")}">`};
  let h="",row=[];
  const flush=()=>{if(row.length){h+=`<div class="${row.length===2?"f2":row.length===3?"f3":"f4"}">${row.join("")}</div>`;row=[]}};
  for(const x of fields){const b=`<div class="field"><label for="f_${x.k}">${esc(x.label)}</label>${f(x)}${x.help?`<span class="help">${esc(x.help)}</span>`:""}</div>`;if(x.half){row.push(b);if(row.length===(x.half===true?2:x.half))flush()}else{flush();h+=b}}
  flush();
  sheet(title,`<form id="gform">${h}<div class="row" style="margin-top:6px">${opts.del?`<button type="button" class="btn danger" data-act="formdel">Excluir</button>`:""}<button class="btn primary grow" type="submit">${esc(opts.ok||"Salvar")}</button></div></form>`);
  formCb.fields=fields;formCb.del=opts.del;
}
function readForm(){const v={};for(const x of formCb.fields){const el=$("#f_"+x.k);v[x.k]=x.type==="number"?num(el.value):el.value.trim()}return v}

/* ---------- gráficos (SVG) ---------- */
let chartN=0;const CH={};
function niceTicks(lo,hi,n=4){if(lo===hi){lo-=1;hi+=1}const span=hi-lo,st0=Math.pow(10,Math.floor(Math.log10(span/n))),e=span/n/st0,st=st0*(e>=5?10:e>=2?5:e>=1?2:1);const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(6));return t}
/* cfg:{labels:[...], series:[{name,color,type:"line"|"bar"|"dots"|"step",vals:[...] , dash}], band:{lo:[],hi:[],color}, unit, h, zero, dec} */
function chart(cfg){
  const id="c"+(++chartN);CH[id]=cfg;
  const W=340,H=cfg.h||170,L=6,R=38,T=8,B=20,n=cfg.labels.length;
  let all=[];cfg.series.forEach(s=>s.vals.forEach(v=>v!=null&&all.push(v)));if(cfg.band){cfg.band.lo.forEach(v=>v!=null&&all.push(v));cfg.band.hi.forEach(v=>v!=null&&all.push(v))}
  if(!all.length)return `<div class="empty">Sem dados neste período ainda.</div>`;
  let lo=Math.min(...all),hi=Math.max(...all);if(cfg.zero||cfg.series.some(s=>s.type==="bar"))lo=Math.min(0,lo);
  if(!cfg.zero&&lo!==0){const p=(hi-lo)*0.15||Math.abs(hi)*0.02||1;lo-=p;hi+=p}
  const tk=niceTicks(lo,hi);lo=tk[0];hi=tk[tk.length-1];
  const bars=cfg.series.some(s=>s.type==="bar"),iw=(W-L-R)/(bars?n:Math.max(1,n-1));
  const X=i=>bars?L+iw*(i+.5):L+iw*i,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g=tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t===0?1:.6}" stroke-dasharray="${t===0?"":"2 4"}"/><text x="${W-R+5}" y="${Y(t)+3.5}">${nf(t,cfg.dec&&Math.abs(hi-lo)<10?1:0)}</text>`).join("");
  const stepL=Math.ceil(n/5);
  for(let i=0;i<n;i+=stepL)g+=`<text x="${X(i)}" y="${H-5}" text-anchor="${i===0&&!bars?"start":"middle"}">${esc(cfg.labels[i])}</text>`;
  if(cfg.band){let up="",dn="";for(let i=0;i<n;i++){if(cfg.band.lo[i]==null)continue;up+=(up?"L":"M")+X(i)+" "+Y(cfg.band.hi[i]);dn="L"+X(i)+" "+Y(cfg.band.lo[i])+dn}if(up)g+=`<path d="${up}${dn}Z" fill="${cfg.band.color}" opacity=".18"/>`}
  for(const s of cfg.series){
    if(s.type==="bar"){const bw=Math.max(2,Math.min(22,iw-2));s.vals.forEach((v,i)=>{if(v==null||v===0)return;const y=Y(v),y0=Y(0),h=Math.abs(y0-y),rr=Math.min(4,bw/2,h);g+=`<path d="M${X(i)-bw/2} ${y0}V${y+rr}q0 ${-rr} ${rr} ${-rr}h${bw-2*rr}q${rr} 0 ${rr} ${rr}V${y0}Z" fill="${s.color}"/>`})}
    else{let d="",last=null;s.vals.forEach((v,i)=>{if(v==null)return;d+=(d?"L":"M")+X(i)+" "+Y(v);last=i});
      if(s.type!=="dots"&&d)g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':""}/>`;
      if(s.type==="dots")s.vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`});
      else if(last!=null&&!s.dash)g+=`<circle cx="${X(last)}" cy="${Y(s.vals[last])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`}
  }
  cfg._g={W,L,R,iw,bars,n};
  const leg=cfg.series.length>1||cfg.band?`<div class="legend">${cfg.series.map(s=>`<span><i class="${s.type==="bar"||s.type==="dots"?"sq":""}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}${cfg.band?`<span><i class="sq" style="background:${cfg.band.color};opacity:.4"></i>${esc(cfg.band.name)}</span>`:""}</div>`:"";
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.title||"Gráfico")}">${g}<line class="cross" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>${leg}`;
}
function chartHover(el,ev){
  const cfg=CH[el.dataset.chart];if(!cfg||!cfg._g)return;const g=cfg._g,rc=el.getBoundingClientRect(),x=(ev.clientX-rc.left)/rc.width*g.W;
  let i=g.bars?Math.floor((x-g.L)/g.iw):Math.round((x-g.L)/g.iw);i=clamp(i,0,g.n-1);
  const rows=cfg.series.filter(s=>s.vals[i]!=null).map(s=>`<span><span class="dot" style="background:${s.color}"></span>${esc(s.name)}: <b style="display:inline">${nf(s.vals[i],cfg.dec?1:0)}${cfg.unit?" "+cfg.unit:""}</b></span>`).join("<br>");
  const tip=$(".tip",el),cr=$(".cross",el),cx=g.bars?g.L+g.iw*(i+.5):g.L+g.iw*i;
  cr.setAttribute("x1",cx);cr.setAttribute("x2",cx);cr.style.display="";
  tip.innerHTML=`<b>${esc(cfg.full?cfg.full[i]:cfg.labels[i])}</b>${rows||"sem registro"}`;tip.style.display="block";
  const px=cx/g.W*rc.width;tip.style.left=clamp(px-tip.offsetWidth/2,0,rc.width-tip.offsetWidth)+"px";
}
function chartOut(el){$(".tip",el).style.display="none";$(".cross",el).style.display="none"}
/* faixa de datas para gráficos */
const RANGES=[["1S","1S",7],["1M","1M",30],["3M","3M",91],["6M","6M",182],["1A","1A",365],["all","Tudo",0]];
let range="1M";
function rangeDays(first){const r=RANGES.find(x=>x[0]===range),t=today();let n=r[2]||Math.max(7,diffDays(first||t,t)+1);const out=[];for(let i=n-1;i>=0;i--)out.push(addDays(t,-i));return out}
/* agrega dias em blocos semanais/mensais quando o período é longo */
function bucket(days,valsList,how="avg"){
  if(days.length<=45)return {labels:days.map(d=>D8(d).getDate()+"/"+(D8(d).getMonth()+1)),full:days.map(wdmy),vals:valsList};
  const size=days.length<=200?7:30,labels=[],full=[],out=valsList.map(()=>[]);
  for(let i=0;i<days.length;i+=size){const sl=days.slice(i,i+size);labels.push(D8(sl[0]).getDate()+"/"+(D8(sl[0]).getMonth()+1));full.push(dmy(sl[0])+" a "+dmy(sl[sl.length-1]));
    valsList.forEach((vals,k)=>{const v=vals.slice(i,i+size).filter(x=>x!=null);out[k].push(v.length?(how==="sum"?sum(v):how==="last"?v[v.length-1]:sum(v)/v.length):null)})}
  return {labels,full,vals:out};
}
const rangeSeg=()=>seg("range",RANGES.map(r=>[r[0],r[1]]),range);
function ring(val,target,color,size=100){const r=42,c=2*Math.PI*r,p=target?clamp(val/target,0,1):0;return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--raised)" stroke-width="6"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="50" text-anchor="middle" style="font:700 22px var(--display);fill:var(--ink)">${nf(val,val%1?1:0)}</text><text x="50" y="66" text-anchor="middle" style="font:11px var(--body);fill:var(--mute)">de ${nf(target,target%1?1:0)}</text></svg>`}
function habitGrid(fn,color){const t=today();let h="";for(let i=29;i>=0;i--){const d=addDays(t,-i);h+=`<i title="${dmy(d)}" style="${fn(d)?"background:"+color:""}"></i>`}return `<div class="habit">${h}</div>`}

/* ================= DIETA ================= */
const MAC=[["k","Calorias","kcal","var(--kcal)"],["p","Proteína","g","var(--prot)"],["c","Carboidrato","g","var(--carb)"],["f","Gordura","g","var(--fat)"]];
const STYLES=[["bal","Equilibrada"],["lowcarb","Low carb"],["lowfat","Low fat"],["keto","Cetogênica"]];
function recipeFood(r){const t={k:0,p:0,c:0,f:0};r.items.forEach(i=>{for(const m in t)t[m]+=i[m]});const s=r.serv||1;return {id:r.id,n:r.n+" (receita)",k:t.k/s,p:t.p/s,c:t.c/s,f:t.f/s,sg:100,sn:"porção",unit:true}}
const allFoods=()=>[...S.diet.recipes.map(recipeFood),...S.diet.foods,...FOODS];
const foodById=id=>allFoods().find(f=>f.id===id);
function dayTot(d){const e=S.dlog[d]||[];return {k:sum(e,x=>x.k),p:sum(e,x=>x.p),c:sum(e,x=>x.c),f:sum(e,x=>x.f),n:e.length}}
function progAt(d){const b=progBase(d),cy=S.diet.cyc;if(!cy||!cy.days||!cy.days.length||cy.days.length>6)return b;
  const nT=cy.days.length,isT=cy.days.includes(D8(d).getDay()),lo=Math.min(cy.d*nT/(7-nT),b.kcal*0.12),hi=lo*(7-nT)/nT,dk=isT?hi:-lo;let c=b.c,f=b.f;
  if(b.style==="keto")f+=dk/9;else if(dk>0)c+=dk/4;else{const cut=Math.min(-dk,c*0.5*4);c-=cut/4;f-=(-dk-cut)/9}
  return {...b,kcal:Math.round(b.kcal+dk),c:Math.round(c),f:Math.round(Math.max(0,f)),dayType:isT?"treino":"descanso"}}
function progBase(d){let p=S.diet.prog;if(d>=p.start)return p;const h=sortBy(S.diet.hist,x=>x.start).reverse();return h.find(x=>x.start<=d)||h[h.length-1]||p}
function weights(){return sortBy(S.body.w,x=>x.d)}
let _tr=null,_trKey="";
function trendMap(){
  const w=weights(),key=JSON.stringify(w)+today();if(key===_trKey)return _tr;
  const m={};if(w.length){const by={};w.forEach(x=>by[x.d]=x.kg);let tr=null;for(let d=w[0].d;d<=today();d=addDays(d,1)){if(by[d]!=null)tr=tr==null?by[d]:tr+0.1*(by[d]-tr);m[d]=tr}}
  _tr=m;_trKey=key;return m;
}
const curTrend=()=>{const m=trendMap();return m[today()]??null};
const curWeight=()=>{const w=weights();return curTrend()??(w.length?w[w.length-1].kg:null)};
function formulaTDEE(){
  const s=S.settings,w=curWeight(),bf=sortBy(S.body.bf,x=>x.d).pop();if(!w)return null;
  let bmr=null;if(bf)bmr=370+21.6*w*(1-bf.v/100);else if(s.age&&s.height)bmr=10*w+6.25*s.height-5*s.age+(s.sex==="f"?-161:5);
  return bmr?Math.round(bmr*s.activity):null;
}
function tdeeEst(){
  const prior=S.diet.prog.tdee||formulaTDEE()||2200,t=today(),m=trendMap();
  const days=[];for(let i=21;i>=1;i--)days.push(addDays(t,-i));
  const logged=days.filter(d=>dayTot(d).k>0),tr=days.filter(d=>m[d]!=null),nW=S.body.w.filter(x=>x.d>=days[0]).length;
  if(logged.length<5||tr.length<8||nW<3)return {v:prior,held:true,n:logged.length,nW};
  const span=diffDays(tr[0],tr[tr.length-1]),dk=m[tr[tr.length-1]]-m[tr[0]],avg=sum(logged,d=>dayTot(d).k)/logged.length;
  const raw=avg-dk*7700/span,c=clamp(logged.length/14,0,1)*0.7;
  return {v:Math.round(clamp(prior+c*(raw-prior),1200,6000)),held:false,n:logged.length,nW,avg:Math.round(avg),dk};
}
function refWeight(w,o={}){const b=sortBy(S.body.bf,x=>x.d).pop(),bf=o.bf??(b?b.v:null),sex=o.sex??S.settings.sex,h=o.height??S.settings.height;if(bf)return Math.min(w,w*(1-bf/100)/(sex==="f"?0.75:0.85));if(h)return Math.min(w,25*(h/100)**2);return w}
function calcTargets(tdee,w,goal,style,pkg,o={}){
  const ref=refWeight(w,o),sexo=o.sex??S.settings.sex;
  const kgwk=goal.type==="manter"?0:goal.rate/100*w;let kcal=tdee+kgwk*7700/7,lim=false;
  const floor=sexo==="f"?1200:1500,lo=Math.max(floor,tdee*0.6),hi=tdee*1.2;
  if(kcal<lo){kcal=lo;lim=true}if(kcal>hi){kcal=hi;lim=true}
  kcal=Math.round(kcal);let p=Math.round(pkg*ref);if(p*4>kcal*0.65)p=Math.round(kcal*0.65/4);
  let c,f;const rest=kcal-p*4;
  if(style==="keto"){c=Math.min(45,Math.round(rest*0.25/4));f=Math.round((rest-c*4)/9)}
  else{const fs={bal:0.4,lowcarb:0.65,lowfat:0.25}[style]||0.4;f=Math.round(rest*fs/9);const mf=Math.round(0.6*ref);if(f<mf&&mf*9<=rest)f=mf;c=Math.round((rest-f*9)/4)}
  return {kcal,p,c:Math.max(0,c),f:Math.max(0,f),lim};
}
function nextCheckin(){let d=addDays(S.diet.lastCheckin||today(),1);while(D8(d).getDay()!==S.settings.checkinDow)d=addDays(d,1);return d}
function forecast(){const g=S.diet.goal,w=curWeight();if(!w||g.type==="manter"||!g.rate)return null;const need=g.target/w;if((g.rate<0&&need>=1)||(g.rate>0&&need<=1))return {done:true};const wk=Math.log(need)/Math.log(1+g.rate/100);return {date:addDays(today(),Math.round(wk*7)),wk:Math.round(wk)}}

function macroBars(tot,pr,mode="c"){
  const tg={k:pr.kcal,p:pr.p,c:pr.c,f:pr.f};
  return `<div class="stack" style="gap:9px">${MAC.map(([m,l,u,col])=>{const v=tot[m],t=tg[m],over=v>t*1.05&&t>0;return `<div class="macro"><div class="lbl"><span><span class="dot" style="background:${col}"></span>${l}</span><span class="num">${mode==="r"?`<b>${nf(t-v)}</b> ${u} restam`:`<b>${nf(v)}</b> / ${nf(t)} ${u}`}${over?' <span class="pill bad">acima</span>':""}</span></div><div class="bar"><span style="width:${t?clamp(v/t*100,0,100):0}%;background:${col}"></span></div></div>`}).join("")}</div>`;
}
function dayStrip(cur,act){const wd=weekDays(cur),t=today();return `<div class="row" style="gap:6px"><button class="icon-btn" data-act="${act}" data-d="${addDays(wd[0],-7)}" aria-label="Semana anterior" style="width:32px">‹</button><div class="days grow">${wd.map(d=>`<button class="day ${d===t?"today":""}" data-act="${act}" data-d="${d}" aria-pressed="${d===cur}"><b>${D8(d).getDate()}</b><span>${WD[D8(d).getDay()]}</span></button>`).join("")}</div><button class="icon-btn" data-act="${act}" data-d="${addDays(wd[0],7)}" aria-label="Próxima semana" style="width:32px">›</button></div>`}

let wkMode="c",dm="peso";
function vDieta(){
  const s=sub.dieta;
  return `<div class="top"><div><h1>Dieta</h1></div><button class="btn sm" data-act="addfood">+ Alimento</button></div>
  <div class="stack">${seg("dieta",[["diario","Diário"],["painel","Painel"],["plano","Plano"]],s)}${s==="diario"?dDiario():s==="painel"?dPainel():dPlano()}</div>`;
}
function dDiario(){
  const e=sortBy(S.dlog[dDate]||[],x=>x.t),tot=dayTot(dDate),pr=progAt(dDate),hours={};
  e.forEach(x=>(hours[x.t.slice(0,2)]??=[]).push(x));
  const list=Object.keys(hours).sort().map(h=>`<div class="hr"><div class="h num">${h}:00<br><span class="tiny">${nf(sum(hours[h],x=>x.k))} kcal</span></div><div>${hours[h].map(x=>`<div class="food" data-act="editentry" data-id="${x.id}"><span class="grow">${esc(x.n)}<br><span class="tiny muted">${x.g?nf(x.g)+(x.u?" porç.":" g")+" · ":""}P ${nf(x.p)} · C ${nf(x.c)} · G ${nf(x.f)}</span></span><b class="num">${nf(x.k)}</b></div>`).join("")}</div></div>`).join("");
  return `${dayStrip(dDate,"dday")}
  <div class="card"><div class="card-head"><h3>${dDate===today()?"Hoje":wdmy(dDate)}${pr.dayType?` <span class="chip">dia de ${pr.dayType}</span>`:""}</h3><span class="muted small num">${nf(pr.kcal-tot.k)} kcal restantes</span></div>${macroBars(tot,pr)}</div>${mealCard()}
  <div class="card"><div class="card-head"><h3>Refeições</h3><span class="muted small">${e.length} ${e.length===1?"item":"itens"}</span></div>
    ${list||`<p class="empty">Nada registrado neste dia. Toque em Adicionar para buscar um alimento.</p>`}
    <div class="row wrap" style="margin-top:12px"><button class="btn primary grow" data-act="addfood">Adicionar alimento</button><button class="btn" data-act="quickadd">Adição rápida</button></div>
    <div class="row wrap" style="margin-top:8px"><button class="btn sm ghost" data-act="copyday">Copiar o dia anterior</button><button class="btn sm ghost" data-act="recipes">Receitas</button><button class="btn sm ghost" data-act="myfoods">Meus alimentos</button><button class="btn sm ghost" data-act="shop">Lista de compras</button></div></div>`;
}
function weekGrid(){
  const wd=weekDays(today()),t=today(),pr=progAt(t),tg={k:pr.kcal,p:pr.p,c:pr.c,f:pr.f},tt=dayTot(t);
  let h="";
  for(const [m,l,u,col] of MAC){
    h+=wd.map(d=>{const v=dayTot(d)[m],T=progAt(d)[m==="k"?"kcal":m];return `<div class="col ${v>T*1.05?"over":""}" title="${wdmy(d)}: ${nf(v)} ${u}"><span style="height:${T?clamp(v/T*100,0,100):0}%;background:${col};${d>t?"opacity:.25":""}"></span></div>`}).join("");
    const v=wkMode==="c"?tt[m]:tg[m]-tt[m];
    h+=`<div class="v num"><b>${nf(v)} ${m==="k"?"":l[0]}</b><span class="muted">de ${nf(tg[m])}${m==="k"?" kcal":""}</span></div>`;
  }
  h+=wd.map(d=>`<div class="d ${d===t?"on":""}">${WD[D8(d).getDay()][0].toUpperCase()}</div>`).join("")+"<div></div>";
  return `<div class="card"><div class="card-head"><h3>Nutrição da semana</h3></div><div class="wk">${h}</div><div style="margin-top:12px">${seg("wkmode",[["c","Consumido hoje"],["r","Restante hoje"]],wkMode)}</div></div>`;

function mesoInfo(){const m=S.train.meso;if(!m)return null;const k=Math.floor(diffDays(m.start,today())/7)+1;if(k<1)return {k:0,W:m.weeks,pre:true,type:m.type};if(k>m.weeks)return {k,W:m.weeks,ended:true,type:m.type};
  if(m.type==="ponte")return {k,W:m.weeks,type:m.type,bridge:true,label:"Bloco de transição: dois terços das séries, longe da falha"};
  if(k===m.weeks)return {k,W:m.weeks,type:m.type,deload:true,label:"Deload: metade das séries, cargas cerca de 10% menores"};
  const off=m.weeks-1-k;return {k,W:m.weeks,type:m.type,off,label:off?`RIR +${off} em relação ao programa`:"Semana mais pesada: RIR como está no programa"}}

const WZ_PROT=[[1.6,"Moderada","1,6 g por kg de referência"],[2,"Alta","2,0 g por kg; padrão para quem treina força"],[2.4,"Muito alta","2,4 g por kg; ajuda na saciedade em déficit"]];
function wzStart(){const s=S.settings,w=weights().pop(),b=sortBy(S.body.bf,x=>x.d).pop(),g=S.diet.goal,pr=S.diet.prog;
  wz={step:0,a:{sex:s.sex,age:s.age||"",height:s.height||"",w:w?w.kg:"",bf:b?b.v:"",daily:"leve",str:3,car:0,type:g.type==="manter"&&!g.target?"perder":g.type,target:g.target||"",rate:0.5,style:pr.style||"bal",prot:WZ_PROT.some(x=>x[0]===pr.pkg)?pr.pkg:2}};closeSheet();go(vWizard)}
function wzKeep(){for(const k of ["age","height","w","bf","str","car","target"]){const el=$("#wz_"+k);if(el)wz.a[k]=el.value}}
const wzN=k=>num(wz.a[k]);
function wzOpts(k,opts){return `<div class="stack" style="gap:8px">${opts.map(o=>`<button class="opt" data-act="wzopt" data-k="${k}" data-v="${o[0]}" aria-pressed="${String(wz.a[k])===String(o[0])}"><b>${o[1]}</b><small>${o[2]}</small></button>`).join("")}</div>`}
const wzIn=(k,label,ph,help)=>`<div class="field"><label for="wz_${k}">${label}</label><input id="wz_${k}" type="text" inputmode="decimal" value="${esc(wz.a[k])}" placeholder="${ph||""}">${help?`<span class="help">${help}</span>`:""}</div>`;
function wzCalc(){
  const a=wz.a,w=wzN("w"),h=wzN("height"),age=wzN("age"),bf=wzN("bf"),lbm=bf?w*(1-bf/100):null;
  const bmr=lbm?370+21.6*lbm:10*w+6.25*h-5*age+(a.sex==="f"?-161:5);
  const fac=Math.min(1.95,{sed:1.2,leve:1.3,mod:1.4,ativo:1.5}[a.daily]+0.035*(wzN("str")||0)+0.03*(wzN("car")||0)),tdee=Math.round(bmr*fac);
  const rate=a.type==="perder"?-(+a.rate):a.type==="ganhar"?+a.rate:0,goal={type:a.type,target:a.type==="manter"?w:wzN("target"),rate};
  const o={bf,sex:a.sex,height:h},n=calcTargets(tdee,w,goal,a.style,+a.prot,o);
  let wk=null;if(rate&&goal.target){const r=Math.log(goal.target/w)/Math.log(1+rate/100);if(r>0)wk=Math.round(r)}
  return {w,bmr:Math.round(bmr),lbm,fac,tdee,goal,n,ref:refWeight(w,o),wk,kgwk:rate/100*w};
}
function vWizard(){
  if(!wz){view=null;return vHoje()}
  const a=wz.a,st=wz.step,T=["Sobre você","Sua rotina","Seu objetivo","Estilo da dieta","Seu plano"];let b="";
  if(st===0)b=`<p class="sec small" style="margin-top:0">Esses dados entram na fórmula do seu gasto calórico.</p><div class="field"><label>Sexo</label><div class="f2">${[["m","Masculino"],["f","Feminino"]].map(o=>`<button class="opt" data-act="wzopt" data-k="sex" data-v="${o[0]}" aria-pressed="${a.sex===o[0]}"><b>${o[1]}</b></button>`).join("")}</div></div>
    <div class="f2">${wzIn("age","Idade","anos")}${wzIn("height","Altura (cm)","175")}</div><div class="f2">${wzIn("w","Peso atual (kg)","80")}${wzIn("bf","Gordura corporal (%)","opcional")}</div><p class="muted tiny" style="margin:0">Se você souber o percentual de gordura (bioimpedância, dobras), o cálculo usa sua massa magra e fica mais preciso. Se não souber, deixe em branco.</p>`;
  else if(st===1)b=`<div class="field"><label>Como é o seu dia fora dos treinos?</label>${wzOpts("daily",WZ_DAILY)}</div><div class="f2">${wzIn("str","Treinos de força por semana","0 a 14")}${wzIn("car","Sessões de cardio por semana","0 a 14")}</div><p class="muted tiny" style="margin:0">Conte cada sessão. Quem treina duas vezes por dia nos dias úteis soma 10.</p>`;
  else if(st===2){const w=wzN("w"),rt=WZ_RATE[a.type];b=`<div class="field"><label>O que você quer?</label><div class="f3">${[["perder","Perder"],["manter","Manter"],["ganhar","Ganhar"]].map(o=>`<button class="opt" style="text-align:center;padding:11px 4px" data-act="wzopt" data-k="type" data-v="${o[0]}" aria-pressed="${a.type===o[0]}"><b>${o[1]}</b></button>`).join("")}</div></div>
    ${a.type==="manter"?`<p class="sec small">Vou calcular as calorias para manter seus ${nf(w,1)} kg.</p>`:`${wzIn("target","Peso alvo (kg)",a.type==="perder"?"menor que "+nf(w,1):"maior que "+nf(w,1))}<div class="field"><label>Em que ritmo?</label>${wzOpts("rate",rt.map(r=>[r[0],`${r[1]} · ${nf(r[0]/100*w,2)} kg por semana`,r[2]]))}</div>`}`}
  else if(st===3)b=`<div class="field"><label>Como você prefere comer?</label>${wzOpts("style",WZ_STYLE)}</div><div class="field"><label>Quanta proteína?</label>${wzOpts("prot",WZ_PROT)}</div>`;
  else{const c=wzCalc(),n=c.n,d=n.kcal-c.tdee,pk=n.p*4,ck=n.c*4,fk=n.f*9,tot=pk+ck+fk||1,row=(l,g,k,col)=>`<tr><td><span class="dot" style="background:${col}"></span>${l}</td><td class="r"><b>${nf(g)} g</b></td><td class="r">${nf(k)} kcal</td><td class="r">${nf(k/tot*100)}%</td></tr>`;
    b=`<div style="text-align:center"><div class="tiny muted">Coma por dia</div><div class="big num" style="font-size:44px">${nf(n.kcal)}<small>kcal</small></div></div>
    <div class="bar" style="height:10px;display:flex;margin:14px 0 6px"><span style="width:${pk/tot*100}%;background:var(--prot);border-radius:4px 0 0 4px"></span><span style="width:${ck/tot*100}%;background:var(--carb);border-radius:0"></span><span style="width:${fk/tot*100}%;background:var(--fat);border-radius:0 4px 4px 0"></span></div>
    <table class="t num"><tbody>${row("Proteína",n.p,pk,"var(--prot)")}${row("Carboidrato",n.c,ck,"var(--carb)")}${row("Gordura",n.f,fk,"var(--fat)")}</tbody></table>
    <p class="sec small">${a.type==="manter"?"Calorias de manutenção.":`${d<0?"Déficit":"Superávit"} de ${nf(Math.abs(d))} kcal por dia, para ${d<0?"perder":"ganhar"} cerca de ${nf(Math.abs(n.lim?d*7/7700:c.kgwk),2)} kg por semana.`}${c.wk&&!n.lim?` Previsão de chegar a ${nf(c.goal.target,1)} kg: ${dmy(addDays(today(),c.wk*7))} de ${D8(addDays(today(),c.wk*7)).getFullYear()} (${c.wk} semanas).`:""}</p>
    ${n.lim?`<p class="small"><span class="pill warn">piso de segurança</span> O ritmo escolhido pediria menos calorias do que o mínimo que o app aceita (60% do gasto, nunca abaixo de ${a.sex==="f"?"1.200":"1.500"} kcal). Fiquei no mínimo, então a perda real será um pouco mais lenta que a escolhida.</p>`:""}
    <div class="card" style="background:var(--raised);margin-top:10px"><h3>Como cheguei nisso</h3><table class="t num" style="margin-top:6px"><tbody>
      <tr><td>Metabolismo basal</td><td class="r"><b>${nf(c.bmr)}</b> kcal</td></tr><tr><td class="muted tiny" colspan="2" style="border-top:0;padding-top:0">${c.lbm?`Katch-McArdle, com ${nf(c.lbm,1)} kg de massa magra`:"Mifflin-St Jeor, por peso, altura, idade e sexo"}</td></tr>
      <tr><td>Fator de atividade</td><td class="r"><b>× ${nf(c.fac,2)}</b></td></tr><tr><td>Gasto diário estimado</td><td class="r"><b>${nf(c.tdee)}</b> kcal</td></tr>
      <tr><td>Proteína</td><td class="r"><b>${nf(+a.prot,1)}</b> g × ${nf(c.ref,1)} kg</td></tr></tbody></table>
      <p class="muted tiny" style="margin:8px 0 0">${c.ref<c.w-0.5?`A proteína usa um peso de referência de ${nf(c.ref,1)} kg, e não o peso total, para não superestimar a necessidade de quem tem mais gordura corporal. `:""}Fibras: mire em cerca de ${nf(n.kcal/1000*14)} g por dia.</p></div>
    <p class="muted tiny">Isso é um ponto de partida calculado por fórmulas. Depois de 2 a 3 semanas registrando comida e peso, o check-in semanal corrige o gasto com os seus dados reais. Não substitui nutricionista ou médico.</p>`}
  return `<div class="row between" style="margin-bottom:14px"><button class="icon-btn" data-act="wzback" aria-label="Voltar">‹</button><div style="text-align:center"><div class="tiny muted">Passo ${st+1} de 5</div><h2>${T[st]}</h2></div><span style="width:42px"></span></div>
  <div class="bar" style="margin-bottom:14px"><span style="width:${(st+1)/5*100}%;background:var(--ink)"></span></div>
  <div class="card">${b}</div><button class="btn primary block" style="margin-top:14px" data-act="${st===4?"wzapply":"wznext"}">${st===4?"Usar este plano":"Continuar"}</button>`;
}
function wzCheck(){
  const a=wz.a,st=wz.step,w=wzN("w"),h=wzN("height"),age=wzN("age"),bf=wzN("bf"),t=wzN("target");
  if(st===0){if(!age||!h||!w)return "Preencha idade, altura e peso.";if(age<18)return "O app só monta dieta para maiores de 18 anos. Antes disso, procure um nutricionista ou médico.";if(age>95||h<130||h>230||w<35||w>300)return "Confira idade, altura (em cm) e peso (em kg).";if(a.bf!==""&&a.bf!=null&&(bf==null||bf<4||bf>60))return "O percentual de gordura deve ficar entre 4 e 60, ou em branco."}
  if(st===1){const s=wzN("str")||0,c=wzN("car")||0;if(s<0||s>14||c<0||c>14)return "Use de 0 a 14 sessões por semana."}
  if(st===2&&a.type!=="manter"){const bmi=x=>x/(h/100)**2;if(!t)return "Informe o peso alvo.";if(a.type==="perder"){if(t>=w)return "Para perder peso, o alvo precisa ser menor que o peso atual.";if(bmi(t)<18.5)return "Esse peso alvo fica abaixo do saudável para a sua altura (IMC menor que 18,5). O mínimo aqui é "+nf(Math.ceil(18.5*(h/100)**2*10)/10,1)+" kg."}
    if(a.type==="ganhar"&&t<=w)return "Para ganhar peso, o alvo precisa ser maior que o peso atual.";if(!WZ_RATE[a.type].some(r=>String(r[0])===String(a.rate)))return "Escolha o ritmo."}
  return null;
}
Object.assign(ACT,{
  editgoal:wzStart,
  wzopt(el){wzKeep();const k=el.dataset.k;wz.a[k]=el.dataset.v;if(k==="type"&&wz.a.type!=="manter"&&!WZ_RATE[wz.a.type].some(r=>String(r[0])===String(wz.a.rate)))wz.a.rate=WZ_RATE[wz.a.type][1][0];render()},
  wznext(){wzKeep();const e=wzCheck();if(e){toast(e);return}wz.step++;render();window.scrollTo(0,0)},
  wzback(){wzKeep();if(wz.step===0){wz=null;back();return}wz.step--;render();window.scrollTo(0,0)},
  wzapply(){const c=wzCalc(),a=wz.a,t=today(),bf=wzN("bf"),old=S.diet.prog;
    Object.assign(S.settings,{sex:a.sex,age:wzN("age"),height:wzN("height"),activity:r1(c.fac*100)/100});
    S.body.w=S.body.w.filter(x=>x.d!==t).concat({d:t,kg:c.w});if(bf)S.body.bf=S.body.bf.filter(x=>x.d!==t).concat({d:t,v:bf});
    S.diet.goal={type:a.type,target:c.goal.target,rate:c.goal.rate,start:t,startW:c.w};
    if(old.start===t)S.diet.hist=S.diet.hist.filter(x=>x.start!==t);else if(!String(old.src||"").startsWith("valores provisórios"))S.diet.hist.push({...old});
    S.diet.prog={start:t,kcal:c.n.kcal,p:c.n.p,c:c.n.c,f:c.n.f,style:a.style,pkg:+a.prot,tdee:c.tdee,src:"calculado pelas suas respostas",lim:!!c.n.lim};S.diet.lastCheckin=t;
    wz=null;stack=[];view=null;sub.dieta="plano";save();location.hash="dieta";onRoute();toast("Plano criado.")}
});
(function boot(){
  const local=readLocal();if(local){try{fromDocs(local)}catch(e){}}
  onRoute();setInterval(tick,1000);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
})();

</script>
</body>
